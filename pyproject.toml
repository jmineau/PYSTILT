[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pystilt"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "A Python implementation of the STILT Lagrangian atmospheric transport model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "jameskmineau@gmail.com"}
]
keywords = ["stilt", "hysplit", "atmospheric-transport", "lagrangian", "footprint", "meteorology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "arlmet>=0.1.0b2",
    "dask[array]>=2023.6",
    "netcdf4>=1.6.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyproj>=3.5",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "typer>=0.9",
    "universal-pathlib>=0.2",
    "xarray>=2023.6",
]

[project.optional-dependencies]
geometry = [
    "exactextract>=0.2",
    "geopandas>=1.0",
    "h3>=4.0",
]
visualization = [
    "cartopy>=0.23",
    "matplotlib>=3.7",
]
download = [
    "arlmet[archives]>=0.1.0b2",
]
sparse = [
    "sparse>=0.15",
]
complete = [
    "pystilt[geometry]",
    "pystilt[visualization]",
    "pystilt[download]",
    "pystilt[sparse]",
]

[dependency-groups]
# Dev tooling and docs together; `uv sync` installs it by default.
dev = [
    "pystilt[complete]",
    "docstr-coverage>=2.3",
    "git-cliff>=2.10",  # `just changelog`
    "import-linter>=2.0",
    "pre-commit>=4.0",
    "pydata-sphinx-theme>=0.16",
    "pyrefly>=1.3",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-dotenv>=0.5.2",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "rust-just>=1.42.4",
    "setuptools-scm>=8",  # `just version`
    "sphinx>=8.1",
    "sphinx-autobuild>=2024.10",  # `just docs-serve`
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "twine>=6.0",  # `just dist`
    # The object-store tests run against a moto server.
    "flask>=3.0",
    "flask-cors>=4.0",
    "moto[s3]>=5.0",
    "s3fs>=2024.2",
]

[project.urls]
Homepage = "https://github.com/jmineau/PYSTILT"
Documentation = "https://jmineau.github.io/PYSTILT/"
Repository = "https://github.com/jmineau/PYSTILT"
Issues = "https://github.com/jmineau/PYSTILT/issues"
Changelog = "https://github.com/jmineau/PYSTILT/blob/main/CHANGELOG.md"

[tool.coverage.run]
source = ["stilt"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]

[tool.importlinter]
root_package = "stilt"
# An import used only for type hints is not a dependency at run time.
exclude_type_checking_imports = true

# The package in layers, top to bottom: a module may import the layers
# below it, never those above. Modules that import each other share a layer
# (joined by ":"); "|" joins modules that must not. The observation layer
# sits above the transport core, which runs without it; receptors and the
# raster layer import nothing above them; a transport model's package, in
# the transport layer, does not import the project config. Exhaustive, so
# a new module has to be placed. Imports inside functions count.
[[tool.importlinter.contracts]]
name = "The package's layers"
type = "layers"
containers = ["stilt"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "observations",
    "project : execution : config",
    "simulation",
    "output",
    "footprint : identity : meteorology : transport",
    "particles",
    "receptors : visualization",
    "transforms | sampling",
    "spatial",
    "_paths | exceptions",
]

# HYSPLIT is one transport model, reached through stilt.transport.get_model.
# Its package is the only place that knows HYSPLIT's files and behaviour, so
# a second model would not have to touch the core.
[[tool.importlinter.contracts]]
name = "Only the transport registry imports HYSPLIT's package"
type = "forbidden"
source_modules = ["stilt.*"]
forbidden_modules = ["stilt.transport.hysplit"]
ignore_imports = ["stilt.transport -> stilt.transport.hysplit"]
# get_model imports a model's package when asked for it; that is the boundary.
allow_indirect_imports = true

# Config classes do no I/O when they validate, so a config.yaml loads
# offline. Reading a footprint geometry or asking a transport model its
# build happens on request, in ProjectConfig.resolve. The config never reads
# results or runs anything. It shares a layer with the project and the
# execution package, which import each other, so this is its own contract.
[[tool.importlinter.contracts]]
name = "The project config reads no results and runs nothing"
type = "forbidden"
source_modules = ["stilt.config"]
forbidden_modules = [
    "stilt.execution.runner",
    "stilt.execution.worker",
    "stilt.output",
    "stilt.project",
    "stilt.simulation",
    "stilt.transport.hysplit",
]
allow_indirect_imports = true

[tool.pyrefly]
project-includes = ["src"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true  # strict markers, config, xfail and parametrize ids
addopts = ["-ra"]
log_level = "INFO"  # show captured logs for failing tests
# Warnings are errors, so deprecations surface early. Ignore a specific
# third-party warning with e.g. "ignore:some message:DeprecationWarning:pkg".
filterwarnings = [
    "error",
    # numpy ignores this one itself (netCDF4 raises it on import); pytest's
    # "error" filter would bring it back.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    # Disjoint: a test has at most one of these. `just test` runs none of them;
    # CI runs -m "integration or fidelity", then -m r_only.
    "integration: PYSTILT end to end, with real met files and HYSPLIT (slow)",
    "fidelity: PYSTILT against STILT-R, both running HYSPLIT on real met files (slow; require STILT_R_DIR and Rscript)",
    "r_only: PYSTILT against STILT-R without met files or HYSPLIT (fast; require STILT_R_DIR and Rscript)",
]
env_files = [".env"]

[tool.repo-review]
# Scientific Python repo-review (`uvx --from "sp-repo-review[cli]" sp-repo-review .`)
# checks that python-template skips on purpose:
ignore = [
    "PY007",  # task runner: just, not nox/tox
    "MY101",  # pyrefly's default preset; tighten per project
    "PC110", "PC190",  # ruff runs as a local `uv run` hook, so uv.lock pins its version
    "PC140",  # pyrefly runs as a local `uv run` hook, so it sees the project's dependencies
    "PC160",  # no spell checker
    "PC180",  # no markdown formatter
    "PC901", "PC902", "PC903",  # pre-commit.ci is not used
]

[tool.ruff]
# target-version comes from project.requires-python

[tool.ruff.format]
docstring-code-format = true
# ruff also formats code blocks in Markdown; the README's examples keep their
# hand-aligned comments.
exclude = ["README.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D213",  # docstring summary on the second line
    "NPY",  # NumPy-specific, incl. NumPy 2 deprecations
    "RUF100",  # unused noqa
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["stilt"]

[project.scripts]
stilt = "stilt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stilt" = ["py.typed"]
"stilt.transport.hysplit" = ["bin/**/*", "data/*"]

[tool.setuptools_scm]
# Releases are git tags vX.Y.Z (see CONTRIBUTING.md). Between releases the
# version is the next one as a dev version, e.g. 0.1.0a23.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when the build config or the git state changes,
# so `__version__` follows new commits and tags.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { git = { commit = true, tags = true } },
]
