[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pystilt"
version = "0.1.0a22"
description = "A Python implementation of the STILT Lagrangian atmospheric transport model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "James Mineau", email = "jameskmineau@gmail.com"}
]
keywords = ["stilt", "hysplit", "atmospheric-transport", "lagrangian", "footprint", "meteorology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "arlmet>=0.1.0b1",
    "netcdf4>=1.6.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyproj>=3.5",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "submitit>=1.5",
    "typer>=0.9",
    "xarray>=2023.6",
]

[project.optional-dependencies]
geometry = [
    "geopandas>=1.0",
    "h3>=4.0",
]
visualization = [
    "matplotlib>=3.7",
]
cloud = [
    "arlmet[archives]>=0.1.0b1",
]
complete = [
    "pystilt[geometry]",
    "pystilt[visualization]",
    "pystilt[cloud]",
]

[dependency-groups]
dev = [
    "pystilt[complete]",
    "build>=1.2",
    "twine>=5.0",
    "docstr-coverage>=2.0.0",
    "import-linter>=2.0",
    "pre-commit>=3.0.0",
    "pyright[nodejs]>=1.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pydata-sphinx-theme>=0.14.0",
    "ruff>=0.1.0",
    "rust-just>=1.42.4",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-design>=0.5",
    "pytest-dotenv>=0.5.2",
]

[project.urls]
Homepage = "https://github.com/jmineau/PYSTILT"
Documentation = "https://jmineau.github.io/PYSTILT/"
Repository = "https://github.com/jmineau/PYSTILT"
Issues = "https://github.com/jmineau/PYSTILT/issues"

[tool.coverage.run]
source = ["src/stilt"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

[tool.importlinter]
root_package = "stilt"
# An import used only for type hints is not a dependency at run time.
exclude_type_checking_imports = true

# The observation layer (product readers, selection, backgrounds) sits above
# the transport core: it builds receptors and reads results. The core must
# run without it.
[[tool.importlinter.contracts]]
name = "The transport core does not import the observation layer"
type = "forbidden"
source_modules = [
    "stilt._atomic",
    "stilt.cli",
    "stilt.config",
    "stilt.exceptions",
    "stilt.execution",
    "stilt.sampling",
    "stilt.footprint",
    "stilt.identity",
    "stilt.spatial",
    "stilt.meteorology",
    "stilt.output",
    "stilt.project",
    "stilt.receptors",
    "stilt.simulation",
    "stilt.particles",
    "stilt.transforms",
    "stilt.transport",
    "stilt.variants",
    "stilt.visualization",
]
forbidden_modules = ["stilt.observations"]

# HYSPLIT is one transport model, reached through stilt.transport.get_model.
# Its package is the only place that knows HYSPLIT's files and behaviour, so
# a second model would not have to touch the core.
[[tool.importlinter.contracts]]
name = "The core does not import HYSPLIT's package"
type = "forbidden"
source_modules = [
    "stilt._atomic",
    "stilt.cli",
    "stilt.config",
    "stilt.exceptions",
    "stilt.execution",
    "stilt.sampling",
    "stilt.footprint",
    "stilt.identity",
    "stilt.spatial",
    "stilt.meteorology",
    "stilt.output",
    "stilt.project",
    "stilt.receptors",
    "stilt.simulation",
    "stilt.particles",
    "stilt.transforms",
    "stilt.variants",
    "stilt.visualization",
]
forbidden_modules = ["stilt.transport.hysplit"]
# get_model imports a model's package when asked for it; that is the boundary.
allow_indirect_imports = true
ignore_imports = [
    # sim.outcome names why a run failed, from the reasons HYSPLIT writes.
    "stilt.simulation -> stilt.transport.hysplit.failures",
]

# Each part owns its config class, next to the code that uses it
# (footprint/config.py, meteorology.py, execution/config.py, a transport
# model's package). stilt.config reads config.yaml and composes them, so it
# sits above those parts, and nothing below the project imports it: that
# would be an import cycle. Direct imports only, since the runner opens a
# Project inside a function.
[[tool.importlinter.contracts]]
name = "Nothing below the project imports the project config"
type = "forbidden"
source_modules = [
    "stilt._atomic",
    "stilt.exceptions",
    "stilt.execution",
    "stilt.footprint",
    "stilt.identity",
    "stilt.meteorology",
    "stilt.output",
    "stilt.particles",
    "stilt.receptors",
    "stilt.sampling",
    "stilt.simulation",
    "stilt.spatial",
    "stilt.transforms",
    "stilt.transport",
    "stilt.visualization",
]
forbidden_modules = ["stilt.config"]
allow_indirect_imports = true

# What the user writes (config.yaml, receptors.csv) is plain data. Resolving
# it, reading geometries or asking a transport model its version, happens
# above, in stilt.variants. Imports inside functions count too. Config may
# look up a model's config class through the stilt.transport registry, which
# imports a model's package only when asked for it.
[[tool.importlinter.contracts]]
name = "The project config reads no results and runs nothing"
type = "forbidden"
source_modules = ["stilt.config"]
forbidden_modules = [
    "stilt.execution.runner",
    "stilt.execution.worker",
    "stilt.output",
    "stilt.project",
    "stilt.simulation",
    "stilt.transport.hysplit",
    "stilt.variants",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Receptors import nothing above them"
type = "forbidden"
source_modules = ["stilt.receptors"]
forbidden_modules = [
    "stilt.config",
    "stilt.execution",
    "stilt.footprint",
    "stilt.identity",
    "stilt.meteorology",
    "stilt.output",
    "stilt.particles",
    "stilt.project",
    "stilt.simulation",
    "stilt.transport",
    "stilt.variants",
]

# A transport model owns its config. The core reaches it through
# stilt.transport.get_model, so a second model has its own parameters.
[[tool.importlinter.contracts]]
name = "HYSPLIT's package does not import the project config"
type = "forbidden"
source_modules = ["stilt.transport.hysplit"]
forbidden_modules = ["stilt.config", "stilt.project", "stilt.variants"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "**/.venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring real met files and HYSPLIT execution",
    "fidelity: STILT-R live comparison tests (slow; require STILT_R_DIR and Rscript)",
]
env_files = [".env"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D213",  # multi-line summary should start at the second line
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["stilt"]

[project.scripts]
stilt = "stilt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stilt" = ["py.typed"]
"stilt.transport.hysplit" = ["bin/**/*", "data/*"]
