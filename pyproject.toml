[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pystilt"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "A Python implementation of the STILT Lagrangian atmospheric transport model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "jameskmineau@gmail.com"}
]
keywords = ["stilt", "hysplit", "atmospheric-transport", "lagrangian", "footprint", "meteorology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "arlmet>=0.1.0b12,<0.2",  # up to the next minor: a release that drops a name PYSTILT imports breaks a fresh install
    "dask[array]>=2023.6",
    "netcdf4>=1.6.5",
    "numpy>=1.26",  # cartopy 0.26 needs it
    "pandas>=2.1",  # xarray 2024.10 needs it
    "pyarrow>=14.0",
    "pyproj>=3.5",
    "pydantic>=2.5.3",  # runtraj's minimum: earlier ones take NaN for a setting with a lower bound, or fail on the fetch settings
    "pyyaml>=6.0",
    "runtraj>=0.1.0a2,<0.2",  # the particle runs, with open_met; up to the next minor, which may break a stage
    "scipy>=1.10",
    "shapely>=2.0",
    "typer>=0.15.4",  # older ones fail with click 8.2 and later (make_metavar)
    "universal-pathlib>=0.3.0",  # 0.2.x warns on S3 paths (PendingDeprecationWarning)
    "xarray>=2024.10.0",  # earlier ones fail to decode the CF trajectory export's time axis (2023.8 and earlier fail Jacobian.to_xarray)
]

[project.optional-dependencies]
geometry = [
    "exactextract>=0.2",
    "geopandas>=1.0",
    "h3>=4.0",
]
visualization = [
    "cartopy>=0.26",  # earlier ones give a projection across 180 without the prime meridian parameter the map tests check
    "matplotlib>=3.7",
]
download = [
    "arlmet[archives]>=0.1.0b12,<0.2",
]
sparse = [
    "sparse>=0.15",
]
stilt-r = [
    "rdata>=1.0",
]
# An output directory or met files in a bucket: s3:// (AWS, MinIO, any
# S3-compatible store) and gs:// (Google Cloud). The container image has both.
s3 = ["s3fs>=2024.12"]
gcs = ["gcsfs>=2024.12"]
complete = [
    "pystilt[geometry]",
    "pystilt[visualization]",
    "pystilt[download]",
    "pystilt[sparse]",
    "pystilt[stilt-r]",
]

[dependency-groups]
# Dev tooling and docs together; `uv sync` installs it by default.
dev = [
    "pystilt[complete]",
    "cf-xarray>=0.10",  # the CF trajectory export is read back with it
    "docstr-coverage>=2.3",
    "git-cliff>=2.10",  # `just changelog`
    "import-linter>=2.0",
    "ipython>=9.0",  # `.. ipython::` in the docs
    "matplotlib>=3.8",  # `.. plot::` in the docs
    "pre-commit>=4.0",
    "pydata-sphinx-theme>=0.22",  # older themes show the version banner on stable/ for PEP 440 versions
    "pyrefly>=1.3",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-dotenv>=0.5.2",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "rust-just>=1.42.4",
    "setuptools-scm>=8",  # `just version`
    "sphinx>=8.2",  # what pydata-sphinx-theme 0.22 requires
    "sphinx-autobuild>=2024.10",  # `just docs-serve`
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "trajan>=0.12",  # the CF trajectory export is opened with it
    "twine>=6.0",  # `just dist`
    # The object-store tests run against a moto server.
    "flask>=3.0",
    "flask-cors>=4.0",
    "moto[s3]>=5.1",
    "s3fs>=2024.2",
]

[project.urls]
Homepage = "https://github.com/jmineau/PYSTILT"
Documentation = "https://jmineau.github.io/PYSTILT/"
Repository = "https://github.com/jmineau/PYSTILT"
Issues = "https://github.com/jmineau/PYSTILT/issues"
Changelog = "https://github.com/jmineau/PYSTILT/blob/main/CHANGELOG.md"

[tool.coverage.run]
source = ["stilt"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]

[tool.importlinter]
root_package = "stilt"
# An import used only for type hints is not a dependency at run time.
exclude_type_checking_imports = true

# The package in layers, top to bottom: a module may import the layers
# below it, never those above. Modules that import each other share a layer
# (joined by ":"); "|" joins modules that must not. The observation layer
# sits above the footprint, which runs without it. The migration module
# writes imported runs into an output directory through variants, so it sits
# above the footprint too. Exhaustive, so a new module has to be placed.
# Imports inside functions count. The particle runs under all of it are
# runtraj's, which imports none of this package.
[[tool.importlinter.contracts]]
name = "The package's layers"
type = "layers"
containers = ["stilt"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "observations | migration",
    "project",
    "simulation",
    "transport_error",
    "background",
    "footprint",
    "particles",
    "visualization",
    "exceptions",
    "_plotting | _paths",
]

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.11"  # as CI checks, against the oldest supported Python

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "src"]  # src: the docstring examples (--doctest-modules below)
strict = true  # strict markers, config, xfail and parametrize ids
addopts = ["-ra", "--doctest-modules"]  # run the `>>>` examples in docstrings as tests
log_level = "INFO"  # show captured logs for failing tests
# Warnings are errors, so deprecations surface early. Ignore a specific
# third-party warning with e.g. "ignore:some message:DeprecationWarning:pkg".
filterwarnings = [
    "error",
    # numpy ignores this one itself (compiled packages such as netCDF4 raise it on
    # import); pytest's "error" filter would bring it back.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
    # matplotlib before 3.10.7 calls pyparsing methods that pyparsing 3.3 deprecates;
    # the floors job installs matplotlib 3.8.
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]
markers = [
    # Disjoint: a test has at most one of these. `just test` runs none of them;
    # CI runs -m integration (tests.yml), -m fidelity and -m r_only (stilt-r.yml).
    "integration: PYSTILT end to end, with real met files and HYSPLIT (slow)",
    "fidelity: PYSTILT against STILT-R, both running HYSPLIT on real met files (slow; require STILT_R_DIR and Rscript)",
    "r_only: PYSTILT against STILT-R without met files or HYSPLIT (fast; require STILT_R_DIR and Rscript)",
]
env_files = [".env"]

[tool.repo-review]
# Scientific Python repo-review (`uvx --from "sp-repo-review[cli]" sp-repo-review .`)
# checks that python-template skips on purpose:
ignore = [
    "PY007",  # task runner: just, not nox/tox
    "MY101",  # pyrefly's default preset; tighten per project
    "PC110", "PC190",  # ruff runs as a local `uv run` hook, so uv.lock pins its version
    "PC140",  # pyrefly runs as a local `uv run` hook, so it sees the project's dependencies
    "PC160",  # no spell checker
    "PC180",  # no markdown formatter
    "PC901", "PC902", "PC903",  # pre-commit.ci is not used
]

[tool.ruff]
# target-version comes from project.requires-python

[tool.ruff.format]
docstring-code-format = true
# ruff also formats code blocks in Markdown; these keep their examples as written
# (e.g. hand-aligned comments).
exclude = ["README.md", "AGENTS.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D",  # pydocstyle, NumPy convention (below)
    "D213",  # docstring summary on the second line
    "NPY",  # NumPy-specific, incl. NumPy 2 deprecations
    "RUF100",  # unused noqa
]
ignore = [
    "E501",  # line too long, handled by formatter
    "D105",  # magic methods need no docstring (docstr-coverage skips them too)
    "D200",  # One-line docstring should fit on one line with quotes
    "D212",  # Multi-line docstring summary should start at the first line
    "D400",  # First line should end with a period, question mark, or exclamation point
]

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings, and a fixture's names what it provides ("A point
# release."); the other docstring rules still apply to them.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D106", "D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["stilt"]

[project.scripts]
stilt = "stilt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stilt" = ["py.typed"]

[tool.setuptools_scm]
# Releases are git tags vX.Y.Z (see CONTRIBUTING.md). Between releases the
# version is the next one as a dev version, e.g. 0.1.0a23.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when the build config or the git state changes,
# so `__version__` follows new commits and tags.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { git = { commit = true, tags = true } },
]
