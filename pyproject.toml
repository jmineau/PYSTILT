[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pystilt"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "A Python implementation of the STILT Lagrangian atmospheric transport model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "jameskmineau@gmail.com"}
]
keywords = ["stilt", "hysplit", "atmospheric-transport", "lagrangian", "footprint", "meteorology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "arlmet>=0.1.0b2",
    "dask[array]>=2023.6",
    "netcdf4>=1.6.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyproj>=3.5",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "typer>=0.9",
    "universal-pathlib>=0.2",
    "xarray>=2023.6",
]

[project.optional-dependencies]
geometry = [
    "exactextract>=0.2",
    "geopandas>=1.0",
    "h3>=4.0",
]
visualization = [
    "cartopy>=0.23",
    "matplotlib>=3.7",
]
download = [
    "arlmet[archives]>=0.1.0b2",
]
sparse = [
    "sparse>=0.15",
]
complete = [
    "pystilt[geometry]",
    "pystilt[visualization]",
    "pystilt[download]",
    "pystilt[sparse]",
]

[dependency-groups]
dev = [
    "pystilt[complete]",
    "build>=1.2",
    "twine>=5.0",
    "docstr-coverage>=2.0.0",
    "import-linter>=2.0",
    "pre-commit>=3.0.0",
    "pyrefly>=1.3",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pydata-sphinx-theme>=0.14.0",
    "ruff>=0.1.0",
    "rust-just>=1.42.4",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-design>=0.5",
    "pytest-dotenv>=0.5.2",
    "s3fs>=2024.2",
    "moto[s3]>=5.0",
    "flask>=3.0",
    "flask-cors>=4.0",
]

[project.urls]
Homepage = "https://github.com/jmineau/PYSTILT"
Documentation = "https://jmineau.github.io/PYSTILT/"
Repository = "https://github.com/jmineau/PYSTILT"
Issues = "https://github.com/jmineau/PYSTILT/issues"

[tool.coverage.run]
source = ["src/stilt"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

[tool.importlinter]
root_package = "stilt"
# An import used only for type hints is not a dependency at run time.
exclude_type_checking_imports = true

# The package in layers, top to bottom: a module may import the layers
# below it, never those above. Modules that import each other share a layer
# (joined by ":"); "|" joins modules that must not. The observation layer
# sits above the transport core, which runs without it; receptors and the
# raster layer import nothing above them; a transport model's package, in
# the transport layer, does not import the project config. Exhaustive, so
# a new module has to be placed. Imports inside functions count.
[[tool.importlinter.contracts]]
name = "The package's layers"
type = "layers"
containers = ["stilt"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "observations",
    "project : execution : config",
    "simulation",
    "output",
    "footprint : identity : meteorology : transport",
    "particles",
    "receptors : visualization",
    "transforms | sampling",
    "spatial",
    "_paths | exceptions",
]

# HYSPLIT is one transport model, reached through stilt.transport.get_model.
# Its package is the only place that knows HYSPLIT's files and behaviour, so
# a second model would not have to touch the core.
[[tool.importlinter.contracts]]
name = "Only the transport registry imports HYSPLIT's package"
type = "forbidden"
source_modules = ["stilt.*"]
forbidden_modules = ["stilt.transport.hysplit"]
ignore_imports = ["stilt.transport -> stilt.transport.hysplit"]
# get_model imports a model's package when asked for it; that is the boundary.
allow_indirect_imports = true

# Config classes do no I/O when they validate, so a config.yaml loads
# offline. Reading a footprint geometry or asking a transport model its
# build happens on request, in ProjectConfig.resolve. The config never reads
# results or runs anything. It shares a layer with the project and the
# execution package, which import each other, so this is its own contract.
[[tool.importlinter.contracts]]
name = "The project config reads no results and runs nothing"
type = "forbidden"
source_modules = ["stilt.config"]
forbidden_modules = [
    "stilt.execution.runner",
    "stilt.execution.worker",
    "stilt.output",
    "stilt.project",
    "stilt.simulation",
    "stilt.transport.hysplit",
]
allow_indirect_imports = true

[tool.pyrefly]
project-includes = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Disjoint: a test has at most one of these. CI runs -m "integration or fidelity", then -m r_only.
    "integration: PYSTILT end to end, with real met files and HYSPLIT (slow)",
    "fidelity: PYSTILT against STILT-R, both running HYSPLIT on real met files (slow; require STILT_R_DIR and Rscript)",
    "r_only: PYSTILT against STILT-R without met files or HYSPLIT (fast; require STILT_R_DIR and Rscript)",
]
env_files = [".env"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D213",  # multi-line summary should start at the second line
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["stilt"]

[project.scripts]
stilt = "stilt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stilt" = ["py.typed"]
"stilt.transport.hysplit" = ["bin/**/*", "data/*"]

[tool.setuptools_scm]
# Releases are git tags vX.Y.Z (see CONTRIBUTING.md). Between releases the
# version is the next one as a dev version, e.g. 0.1.0a23.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when the build config or the git state changes,
# so `__version__` follows new commits and tags.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { git = { commit = true, tags = true } },
]
