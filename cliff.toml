# git-cliff (https://git-cliff.org) turns Conventional Commits into changelog
# entries. `just changelog` prints the entries since the last release for you
# to edit into CHANGELOG.md under ## [Unreleased]; it never writes the file.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.scope %} ({{ commit.scope }}){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
# The first matching parser wins. The <!-- n --> prefixes order the sections.
commit_parsers = [
    { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 1 -->Changed" },  # any breaking change
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
    { message = "^revert", group = "<!-- 2 -->Removed" },
    { message = "^fix", group = "<!-- 3 -->Fixed" },
    { message = "^(build|chore|ci|docs|style|test)", skip = true },
]
