repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/observations/data/products/  # product slices stay byte for byte
      - id: end-of-file-fixer
        exclude: ^tests/observations/data/products/  # product slices stay byte for byte
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject

  # Security audit of the GitHub Actions workflows (policy in .github/zizmor.yml).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  # These run the tools in .venv, so their versions are the ones in uv.lock (one
  # place to update; Dependabot does it) and pyrefly sees the project's
  # dependencies. --no-sync: a hook never re-syncs .venv; run `just sync` after
  # changing dependencies.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        files: ^(uv\.lock|pyproject\.toml)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --show-fixes --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pyrefly
        name: pyrefly
        entry: uv run --no-sync pyrefly check
        language: system
        types: [python]
        pass_filenames: false
