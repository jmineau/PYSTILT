# Dependabot opens pull requests that update pinned versions. Each ecosystem
# gets one grouped PR a month, and skips releases younger than a week
# (supply-chain safety). CI runs on each PR; merge it or close it. uv.lock is
# not here: the Upgrade lock workflow (.github/workflows/lock-upgrade.yml) does it.
version: 2
updates:
  # Actions used by the workflows (actions/checkout@v7, ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Hook revs in .pre-commit-config.yaml (ruff and pyrefly come from uv.lock)
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
