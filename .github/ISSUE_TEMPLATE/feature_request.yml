name: Feature request
description: Suggest a new capability or an API improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or analysis this would support, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: What you would like to be able to write. Sketches are welcome.
      render: python
