name: Documentation

# Pull requests build the docs (warnings fail the build). Pushes to main publish
# them as dev/, release tags as <version>/ (final releases also as stable/), with
# a version dropdown. The gh-pages branch is the site: .github/scripts/
# docs_versions.py adds each build to it, and GitHub Pages serves the branch
# (Settings > Pages > Source: Deploy from a branch), rebuilding after each push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Which pre-releases (a, b, rc) the dropdown lists:
  #   upcoming: those newer than the latest final release; older ones are deleted
  #             from the site once their final release is out
  #   all:      every pre-release ever published
  #   none:     no pre-releases (their folders are kept but not listed)
  DOCS_PRERELEASES: upcoming

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment synced below

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14"

      - name: Install
        run: uv sync --locked

      # The Getting Started page runs a real simulation on the met files the
      # tests cache: the same cache and key as tests.yml.
      - name: Restore HRRR met cache
        id: met-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/met_cache
          key: met-hrrr-2021-v1

      - name: Prewarm HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        env:
          STILT_TEST_FETCH_MET: "1"
        run: |
          uv run pytest \
            tests/transport/hysplit/test_release_assignment.py::test_hysplit_multipoint_release_points_follow_control_order \
            --setup-only -q

      - name: Save HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tests/met_cache
          key: ${{ steps.met-cache.outputs.cache-primary-key }}

      - name: Build
        env:
          STILT_TEST_MET_DIR: ${{ github.workspace }}/tests/met_cache
        run: uv run just build-docs

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: docs-html
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy  # one update of the gh-pages branch at a time
      cancel-in-progress: false
    permissions:
      contents: write  # push the gh-pages branch

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: src

      - uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: html

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: Check out the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" gh-pages > /dev/null; then
            git clone --quiet --single-branch --branch gh-pages "https://github.com/$GITHUB_REPOSITORY" site
          else
            git init --quiet site
            git -C site checkout --quiet --orphan gh-pages
          fi

      - name: Add this build to the site
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then target="${GITHUB_REF_NAME#v}"; else target=dev; fi
          echo "target=$target" >> "$GITHUB_ENV"
          uv run --no-project --with packaging python src/.github/scripts/docs_versions.py \
            site html "$target" \
            --base-url "https://jmineau.github.io/PYSTILT/" \
            --prereleases "$DOCS_PRERELEASES"

      # GitHub Pages serves the branch, so this push publishes the site: its
      # "pages build and deployment" run (in the Actions tab) finishes within a
      # minute. A push by the workflow's own token does trigger that run.
      - name: Push the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git add --all
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "docs: publish $target"
          if ! git remote | grep -q origin; then git remote add origin "https://github.com/$GITHUB_REPOSITORY"; fi
          git push --quiet origin gh-pages
