name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # HYSPLIT runs on Linux and macOS. The unit tests need no hycs_std.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment synced below

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Unit tests
        run: uv run just cov

      # A job that runs tests this one skips (say, one with optional extras
      # installed) should upload its own coverage.xml the same way: Codecov merges
      # the uploads, and a line run in either job counts as covered. Without it,
      # the modules behind the extras show as untested.
      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Upload test results to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results

  # The lowest versions pyproject.toml allows, on the oldest Python. Every
  # direct dependency needs a minimum: without one, uv picks its oldest release.
  floors:
    name: minimum dependencies / Python 3.11
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment installed below

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.11"

      - name: Install
        run: uvx --from rust-just just sync-floors

      - name: Test
        run: uv run just test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest  # STILT-R's hycs_std is linux_x64
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Install HYSPLIT
        run: .github/scripts/install_hysplit.sh

      - name: Restore HRRR met cache
        id: met-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/met_cache
          # Bump the version suffix when _MET_BLOCKS changes in conftest.py
          # (the same key in stilt-r.yml and docs.yml)
          key: met-hrrr-2021-v1

      - name: Prewarm HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        env:
          STILT_TEST_FETCH_MET: "1"
        run: |
          uv run pytest \
            tests/integration/test_pressure_weighting.py::test_hypsometric_fit_holds_on_a_real_winter_profile \
            --setup-only -q

      - name: Save HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tests/met_cache
          key: ${{ steps.met-cache.outputs.cache-primary-key }}

      - name: Run integration tests
        env:
          STILT_TEST_MET_DIR: ${{ github.workspace }}/tests/met_cache
        # One worker per core (4 on ubuntu-latest); conftest.py groups the tests
        # that share a HYSPLIT run.
        run: uv run pytest tests/ -v -m integration -n auto --dist loadgroup

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Build and check the sdist and wheel
        run: uv run just dist

      # runtraj comes from PyPI, unless pyproject.toml takes it from a commit
      # ([tool.uv.sources]) while a change there waits for a release.
      - name: Install the wheel in a clean environment
        run: |
          runtraj="$(sed -nE 's/^runtraj = \{ git = "([^"]+)", rev = "([0-9a-f]{40})" \}$/git+\1@\2/p' pyproject.toml)"
          uv venv .pkgtest
          uv pip install --python .pkgtest dist/*.whl ${runtraj:+"runtraj @ $runtraj"}

      - name: Smoke test the installed package
        run: |
          .pkgtest/bin/python -c "import stilt; print(stilt.__version__)"
          .pkgtest/bin/python -m stilt --help
          .pkgtest/bin/stilt --help

      - name: Check the wheel and sdist hold no HYSPLIT file
        run: |
          .pkgtest/bin/python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          hysplit = ("hycs_std", "ASCDATA.CFG", "LANDUSE.ASC", "ROUGLEN.ASC", "TERRAIN.ASC")
          for wheel in Path("dist").glob("*.whl"):
              found = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(hysplit)]
              assert not found, f"{wheel.name} holds {found}"
          for sdist in Path("dist").glob("*.tar.gz"):
              found = [n for n in tarfile.open(sdist).getnames() if n.endswith(hysplit)]
              assert not found, f"{sdist.name} holds {found}"
          PY

      - name: Without hycs_std, the installed package says what to set
        run: |
          .pkgtest/bin/python - <<'PY'
          from runtraj.exceptions import HYSPLITNotFoundError
          from runtraj.models.hysplit import find_hycs_std

          try:
              find_hycs_std()
          except HYSPLITNotFoundError as err:
              print(err)
          else:
              raise SystemExit("found a hycs_std on a runner that has none")
          PY
