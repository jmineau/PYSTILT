name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # HYSPLIT runs on Linux and macOS. The unit tests need no hycs_std.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment synced below

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Unit tests
        run: uv run just cov

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Upload test results to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results

  integration:
    name: Integration tests
    runs-on: ubuntu-latest  # STILT-R's hycs_std is linux_x64
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Install hycs_std
        run: .github/scripts/install_hycs_std.sh

      - name: Restore HRRR met cache
        id: met-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/met_cache
          # Bump the version suffix when _MET_BLOCKS changes in conftest.py
          # (the same key in stilt-r.yml and docs.yml)
          key: met-hrrr-2021-v1

      - name: Prewarm HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        env:
          STILT_TEST_FETCH_MET: "1"
        run: |
          uv run pytest \
            tests/transport/hysplit/test_release_assignment.py::test_hysplit_multipoint_release_points_follow_control_order \
            --setup-only -q

      - name: Save HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tests/met_cache
          key: ${{ steps.met-cache.outputs.cache-primary-key }}

      - name: Run integration tests
        env:
          STILT_TEST_MET_DIR: ${{ github.workspace }}/tests/met_cache
        # One worker per core (4 on ubuntu-latest); conftest.py groups the tests
        # that share a HYSPLIT run.
        run: uv run pytest tests/ -v -m integration -n auto --dist loadgroup

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Build and check the sdist and wheel
        run: uv run just dist

      - name: Install the wheel in a clean environment
        run: |
          uv venv .pkgtest
          uv pip install --python .pkgtest dist/*.whl

      - name: Smoke test the installed package
        run: |
          .pkgtest/bin/python -c "import stilt; print(stilt.__version__)"
          .pkgtest/bin/python -m stilt --help
          .pkgtest/bin/stilt --help
          .pkgtest/bin/python -c "from stilt.transport.hysplit.driver import _bundled_data_dir; assert (_bundled_data_dir() / 'ASCDATA.CFG').is_file()"

      - name: Check the wheel and sdist hold no hycs_std
        run: |
          .pkgtest/bin/python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          for wheel in Path("dist").glob("*.whl"):
              found = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith("hycs_std")]
              assert not found, f"{wheel.name} holds {found}"
          for sdist in Path("dist").glob("*.tar.gz"):
              found = [n for n in tarfile.open(sdist).getnames() if n.endswith("hycs_std")]
              assert not found, f"{sdist.name} holds {found}"
          PY

      - name: Without hycs_std, the installed package says what to set
        run: |
          .pkgtest/bin/python - <<'PY'
          from stilt.exceptions import HYSPLITNotFoundError
          from stilt.transport.hysplit import find_hycs_std

          try:
              find_hycs_std()
          except HYSPLITNotFoundError as err:
              print(err)
          else:
              raise SystemExit("found a hycs_std on a runner that has none")
          PY
