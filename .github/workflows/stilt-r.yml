name: STILT-R parity

# The STILT-R comparisons (markers fidelity and r_only): PYSTILT against a pinned
# uataq/stilt commit. The job takes about 25 minutes, so it runs only when a change
# touches what it checks (the integration tests, a few minutes, run in tests.yml):
#
#   src/stilt/      everything but observations/ and visualization.py, which no
#                   STILT-R test reaches. The fidelity scenarios run a project end
#                   to end (config, project, execution, transport/hysplit and its
#                   bundled binaries, particles, footprint, receptors, output);
#                   the r_only tests also read STILT-R output (migration.py).
#   tests/          the STILT-R tests, the shared conftest.py (its _MET_BLOCKS name
#                   the met cache), the fixtures and R helpers, and the
#                   release-assignment test whose setup prewarms the met cache.
#   uv.lock, pyproject.toml
#                   the dependencies and the pytest settings (warnings are errors).
#   this file       so a STILT_R_SHA bump runs it.
#
# It also runs on a push to main (main tested with every merged change together),
# by hand (workflow_dispatch), and when the Upgrade lock and Upgrade STILT-R
# workflows start it on their branches.
on:
  push:
    branches: [main]
    paths: &paths
      - "src/stilt/**"
      - "!src/stilt/observations/**"
      - "!src/stilt/visualization.py"
      - "tests/conftest.py"
      - "tests/fixtures/**"
      - "tests/r_stilt/**"
      - "tests/transport/hysplit/test_release_assignment.py"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/stilt-r.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stilt-r:
    name: STILT-R tests
    runs-on: ubuntu-latest  # HYSPLIT binary is linux_x64 only
    env:
      UV_NO_SYNC: "1"
      # Pinned uataq/stilt commit used for STILT-R fidelity comparison.
      #
      # HOW TO UPDATE:
      #   1. Bump STILT_R_SHA to the new commit.
      #   2. Run the fidelity tests locally:
      #        STILT_R_DIR=stilt-r-src uv run pytest tests/r_stilt/ -v -m fidelity
      #   3. If tests pass  → commit the new SHA.
      #      If tests diverge → read the diff; determine whether PYSTILT or STILT-R
      #      changed and update whichever is wrong before committing the SHA bump.
      #
      # WHAT TO WATCH in uataq/stilt git log:
      #   r/src/calc_footprint.r   — gridding, interpolation, kernel bandwidth
      #   r/src/calc_trajectory.r  — the HYSPLIT wrapper, random seed, krand
      #   r/src/calc_plume_dilution.r — HNF plume dilution
      #   r/src/permute.f90        — inner Gaussian scatter loop
      #   r/src/write_footprint.r  — output format / precision (float32 assumption)
      #
      # The R helpers in tests/fixtures/r_helpers/ source every file in r/src/, and
      # STILT-R's HYSPLIT run uses bin/linux_x64/hycs_std and exe/, so once a month
      # the Upgrade STILT-R workflow (stilt-r-upgrade.yml) opens a pull request that
      # bumps STILT_R_SHA when a new upstream commit touches any of those.
      #
      # IGNORE: run_stilt.r, stilt_cli.r, docs, R package scaffolding.
      STILT_R_SHA: 278b1ef6d542efd21c6ccab2a85b796acd9812a6

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Restore HRRR met cache
        id: met-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/met_cache
          # Bump the version suffix when _MET_BLOCKS changes in conftest.py
          # (the same key in tests.yml and docs.yml)
          key: met-hrrr-2021-v1

      - name: Prewarm HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        env:
          STILT_TEST_FETCH_MET: "1"
        run: |
          uv run pytest \
            tests/transport/hysplit/test_release_assignment.py::test_hysplit_multipoint_release_points_follow_control_order \
            --setup-only -q

      - name: Save HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tests/met_cache
          key: ${{ steps.met-cache.outputs.cache-primary-key }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true  # prebuilt Linux binaries of CRAN packages

      - name: Install system dependencies for R packages
        run: sudo apt-get install -y libnetcdf-dev libgdal-dev libgeos-dev libproj-dev libssl-dev libxml2-dev

      # The packages the R helpers load (load_libs in tests/fixtures/r_helpers/).
      # STILT-R's load_libs installs a missing one from source at the first Rscript
      # call, which took about 10 minutes; here they come as cached binaries.
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::dplyr
            any::lubridate
            any::ncdf4
            any::proj4
            any::raster
            any::R.utils

      - name: Clone uataq/stilt R source at pinned commit
        run: |
          git init stilt-r-src
          git -C stilt-r-src fetch --depth 1 https://github.com/uataq/stilt "$STILT_R_SHA"
          git -C stilt-r-src checkout FETCH_HEAD

      - name: Populate STILT-R exe directory from bundled binaries
        run: |
          mkdir -p stilt-r-src/exe
          cp stilt-r-src/bin/linux_x64/hycs_std stilt-r-src/exe/hycs_std
          chmod +x stilt-r-src/exe/hycs_std

      - name: Build permute.so
        run: |
          cd stilt-r-src/r/src
          R CMD SHLIB permute.f90

      - name: Run STILT-R fidelity tests
        env:
          STILT_R_DIR: ${{ github.workspace }}/stilt-r-src
          STILT_TEST_MET_DIR: ${{ github.workspace }}/tests/met_cache
        # One worker per core; conftest.py keeps each scenario's tests on one
        # worker, so its PYSTILT and STILT-R runs happen once.
        run: uv run pytest tests/ -v -m fidelity -n auto --dist loadgroup

      - name: Run STILT-R synthetic footprint tests
        env:
          STILT_R_DIR: ${{ github.workspace }}/stilt-r-src
          STILT_TEST_MET_DIR: ${{ github.workspace }}/tests/met_cache
        run: uv run pytest tests/r_stilt -v -m r_only -n auto --dist loadgroup
